[build]
  publish = "."
  functions = "netlify/functions"

# Clean URL alias so the admin page hits /api/messages
# instead of /.netlify/functions/messages-list
[[redirects]]
  from = "/api/messages"
  to = "/.netlify/functions/messages-list"
  status = 200

# The server/ and deploy/ folders are only used by the self-hosted (Linode)
# deployment. They get published as static files here too, so 404 them to keep
# the backend source + deploy docs off the public Netlify site.
[[redirects]]
  from = "/server/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/deploy/*"
  to = "/404.html"
  status = 404

# /admin/* lives at the root path — keep robots out of it
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Global security headers — safe defaults flagged by Lighthouse +
# securityheaders.com. None of these break anything; they just close
# common attack surfaces.
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent MIME-sniffing attacks (browser must respect the declared content-type)
    X-Content-Type-Options = "nosniff"
    # Don't leak full URL paths to third-party referrers
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Disable browser features the portfolio doesn't use
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    # Allow site to be embedded only by itself (clickjacking prevention)
    X-Frame-Options = "SAMEORIGIN"
