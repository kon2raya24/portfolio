# Portfolio site — static files + form-POST routing to the Node backend.
# Installed at /etc/nginx/sites-available/portfolio (symlinked into sites-enabled).
#
# The site's contact forms stay Netlify-style: they POST to the page they live on
# (`/` and `/classic.html`). On Netlify, Netlify Forms captures them. Here, nginx
# routes those POSTs to the Node backend while still serving the pages on GET — so
# the exact same HTML works on both platforms.
#
# Replace YOUR_DOMAIN below, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN
# certbot rewrites this file to add the TLS (443) server + an 80->443 redirect.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    root /var/www/portfolio;
    index index.html;

    # --- compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;

    # --- never serve the backend's own files over HTTP ----------------------
    # /server/ holds server.js AND data/messages.jsonl (every submission!).
    # /deploy/ holds the deploy docs. ^~ beats the static-asset regex below.
    location ^~ /server/ { return 404; }
    location ^~ /deploy/ { return 404; }

    # --- admin API (GET /api/messages, health) -> Node backend --------------
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    # --- admin viewer — keep search engines out, never cache ----------------
    location /admin/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ $uri.html =404;
    }

    # --- block dotfiles (.git, .env, etc.) — must precede the asset regex ----
    location ~ /\.(?!well-known) {
        deny all;
    }

    # --- home page: GET serves index.html, POST (contact form) -> backend ---
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        limit_except GET HEAD {
            include /etc/nginx/snippets/proxy-backend.conf;
        }
        try_files $uri /index.html;
    }

    # --- classic page: same dual behavior (its form posts to /classic.html) -
    location = /classic.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        limit_except GET HEAD {
            include /etc/nginx/snippets/proxy-backend.conf;
        }
        try_files $uri =404;
    }

    # --- long-cache static assets -------------------------------------------
    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|svg|png|jpe?g|webp|gif|ico|map|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # --- HTML + clean URLs — don't cache HTML so edits show immediately ------
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
