# Reverse-proxy settings for the Node backend (127.0.0.1:3000).
# Installed at /etc/nginx/snippets/proxy-backend.conf and `include`d wherever a
# request must reach the backend (the /api/ location and the form-POST routes).
proxy_pass http://127.0.0.1:3000;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_read_timeout 30s;
