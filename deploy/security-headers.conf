# Global security headers — ported from the old netlify.toml.
# Installed at /etc/nginx/snippets/security-headers.conf and `include`d in every
# location block. (nginx's add_header does NOT inherit into a location that
# defines its own add_header, so we include it explicitly everywhere.)
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
